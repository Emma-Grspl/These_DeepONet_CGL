experiment_name: "CGL_Local_Single_Case"
device: "cuda"

physics:
  x_domain: [-40.0, 40.0]
  t_max: 1.2
  initial_conditions: [0]
  bounds:
    A: [0.25, 0.25]
    w0: [1.25, 1.25]
    x0: [0.0, 0.0]
    k: [0.0, 0.0]
  equation_params:
    alpha: [0.75, 0.75]
    beta: [0.0, 0.0]
    mu: [0.0, 0.0]
    V: [0.0, 0.0]

operator:
  dt_local: 0.0125
  nx: 256
  sensor_nx: 128
  eval_times: [0.1, 0.2, 0.5, 1.0, 1.1, 1.2]
  primary_eval_time: 1.2

model:
  latent_dim: 256
  branch_layers: [512, 512, 512]
  trunk_layers: [256, 256, 256]
  activation: "silu"

training:
  seed: 1234
  batch_size: 2048
  train_steps: 40000
  learning_rate: 2.0e-4
  weight_decay: 1.0e-6
  grad_clip: 1.0
  lr_decay_step: 5000
  lr_decay_gamma: 0.9
  log_every: 1000
  eval_every: 2000
  checkpoint_every: 5000
  save_dir: "results/CGL_local"
