experiment_name: "CGL_GlobalMultistage_Parametric_alpha_only_base_t5"
device: "cuda"

physics:
  x_domain: [-40.0, 40.0]
  t_max: 5.0
  initial_conditions: [0]
  bounds:
    A: [0.1, 0.1]
    w0: [0.6, 0.6]
    x0: [0.0, 0.0]
    k: [0.0, 0.0]
  equation_params:
    alpha: [0.5, 1.5]
    beta: [0.0, 0.0]
    mu: [0.0, 0.0]
    V: [0.0, 0.0]

model:
  branch_input_dim: 9
  trunk_input_dim: 2
  latent_dim: 512
  branch_layers: [512, 512, 512, 512, 512]
  trunk_layers: [512, 512, 512, 512]
  activation: "silu"
  fourier_dim: 64
  fourier_scales: [1.0, 2.0, 5.0, 10.0, 20.0]

multistage:
  time_blocks:
    - [0.0, 1.0]
    - [1.0, 2.0]
    - [2.0, 3.0]
    - [3.0, 4.0]
    - [4.0, 5.0]

data:
  solver_nx: 256
  solver_dt: 0.025
  train_queries: 8192
  valid_queries: 4096

parametric_dataset:
  train_cases: 96
  valid_cases: 24
  seed: 1240

hard_case_sampling:
  enabled: true
  audit_cases: 50
  audit_seed_offset: 2000
  warmup_epochs: 5000
  refresh_every: 2000
  hard_fraction: 0.4
  mix_hard_ratio: 0.7
  success_threshold: 0.05
  activation_mean_threshold: 0.05
  activation_bad_fraction_threshold: 0.2
  activation_max_threshold: 0.10

parametric_curriculum:
  enabled: true
  phases:
    - end_epoch: 10000
      physics:
        equation_params:
          alpha: [0.5, 1.0]
    - end_epoch: 20000
      physics:
        equation_params:
          alpha: [0.5, 1.25]
    - end_epoch: 30000
      physics:
        equation_params:
          alpha: [0.5, 1.5]

training:
  save_dir: "results/CGL_GlobalMultistage_Parametric_alpha_only_base_t5"
  stage_num_epochs: 30000
  learning_rate: 2.0e-4
  weight_decay: 1.0e-6
  grad_clip: 1.0
  log_every: 200
  eval_every: 1000
  snapshot_every: 5000

evaluation:
  cases:
    - label: "alpha_min"
      A: 0.1
      w0: 0.6
      alpha: 0.5
      beta: 0.0
      mu: 0.0
    - label: "alpha_mid"
      A: 0.1
      w0: 0.6
      alpha: 1.0
      beta: 0.0
      mu: 0.0
    - label: "alpha_max"
      A: 0.1
      w0: 0.6
      alpha: 1.5
      beta: 0.0
      mu: 0.0
