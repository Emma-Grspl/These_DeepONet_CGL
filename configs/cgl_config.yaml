experiment_name: "CGL_Talanov_V1"
device: "cuda"

physics:
  # Domaine spatial réduit puisque la Gaussienne est centrée et s'étale peu
  x_domain: [-40.0, 40.0] 
  # Objectif long terme
  t_max: 5.0
  # Uniquement la Gaussienne
  initial_conditions: [0]
  bounds:
    # Amplitude faible (régime quasi-linéaire)
    A: [0.1, 0.3]
    w0: [0.5, 2.0]
    x0: [0.0, 0.0]
    k: [-2.0, 2.0]
  equation_params:
    alpha: [0.0, 1.0]
    beta: [-1.5, 1.5]
    mu: [-0.5, 1.0]
    # Vitesse fixée à zéro
    V: [0.0, 0.0]

model:
  branch_input_dim: 9 
  trunk_input_dim: 2
  latent_dim: 512
  branch_layers: [512, 512, 512, 512, 512]
  trunk_layers: [512, 512, 512, 512]
  activation: "silu"
  fourier_dim: 64
  fourier_scales: [1.0, 2.0, 5.0, 10.0, 20.0] 

training:
  # Gros batchs maintenus pour une exploration robuste de la PDE
  batch_size_ic: 8192    
  batch_size_pde: 8192    
  
  # Paramètres de la Trust-Region (Macro-Loops)
  max_macro_loops: 1 #on s'en fiche logiquement
  
  weights:
    bc_loss: 1.0

  physics_losses:
    pde_relative_weight: 0.5
    weak_weight: 0.05
    mass_weight: 0.05
    continuity_weight: 0.1
    mass_n_cases: 16
    mass_n_x: 128
    continuity_batch_size: 2048

  early_stop:
    enabled: true
    min_iters: 10000
    patience_audits: 6
    min_score_improvement: 0.001
    min_loss_improvement_rel: 0.03

  hard_audit:
    enabled: true
    skip_first_step: true
    n_cases: 60
    medium_factor: 1.5
    hard_top_fraction: 0.2
    medium_top_fraction: 0.2
    mix_hard: 0.5
    mix_medium: 0.2
    mix_global: 0.3

  target_schedule:
    early_time_relaxation:
      - t_max: 0.1
        target_error: 0.09
      - t_max: 0.2
        target_error: 0.07
      - t_max: 0.5
        target_error: 0.055
    
  target_error_global: 0.045   
  save_dir: "results/CGL_Talanov_V1"

time_marching:
  # LR de départ de la Macro-Loop (qui sera divisé par 2 en cas d'échec)
  learning_rate: 2e-4
  lr_decay_step: 5000
  lr_decay_gamma: 0.9
  # Nouvelles zones adaptées pour T_max = 10.0
  zones:
    - t_end: 1.0
      dt: 0.1
      iters: 30000
    - t_end: 2.0
      dt: 0.1
      iters: 40000
    - t_end: 3.0
      dt: 0.1
      iters: 40000
    - t_end: 5.0
      dt: 0.1
      iters: 30000
