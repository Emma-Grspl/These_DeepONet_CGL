experiment_name: "CGL_Generalist_Solver_Lite"
device: "cuda"

physics:
  # 1. DOMAINE OPTIMISÉ (Asymétrique car V > 0)
  # On laisse un peu de place à gauche (-7) pour que la queue de la Sech soit bien à 0.
  # On laisse de la place à droite (12) pour que l'onde avance.
  x_domain: [-7.0, 12.0]
  t_max: 4.0

  initial_conditions: [1, 2]

  bounds:
    A: [0.5, 3.0]      # On évite les amplitudes trop petites (<0.5) qui sont du bruit
    
    # 2. LARGEUR SÉCURISÉE
    # w0 = 0.5 -> Très large (Facile)
    # w0 = 2.0 -> Assez fin (Intéressant) mais pas "invisible" comme 6.0
    w0: [0.5, 2.0]
    
    x0: [0.0, 0.0]     # Toujours centré, très bien
    k: [-2.0, 2.0]     # Le "Twist" (fréquence spatiale), touche pas, c'est important

  equation_params:
    alpha: [0.0, 1.0]
    beta: [-1.5, 1.5]
    mu: [-0.5, 1.0]
    
    # 3. VITESSE POSITIVE
    # On force l'onde à aller vers la droite pour ne pas gâcher l'espace à gauche
    V: [0.0, 1.0]
model:
  branch_input_dim: 9 
  trunk_input_dim: 2
  latent_dim: 256              # <--- RÉDUIT (Était 512)
  
  branch_layers: [256, 256, 256, 256, 256] # <--- 5 couches au lieu de 6
  trunk_layers: [256, 256, 256, 256]       # <--- 4 couches suffisent
  
  activation: "silu"
  
  fourier_dim: 64
  fourier_scales: [1.0, 2.0, 5.0, 10.0, 20.0] 

training:
  batch_size_ic: 16384   
  batch_size_pde: 16384   
  
  # Stratégie Robustesse
  max_macro_loops: 6          
  nb_adam_retries: 2         
  check_interval: 2000
  stagnation_threshold: 0.001
  
  pde_weight_start: 0.0001     # <--- Agit comme un "fusible" pour les 100 premières iters
  pde_weight_target: 0.1       # <--- On bride la cible max pour ne pas écraser l'IC
  ramp_end_t: 0.5              # On s'en fiche un peu maintenant, l'adaptatif domine
  
  weights:
    pde_loss: 0.0001           # Valeur initiale
    ic_loss_start: 2.0         # Pas besoin de monter à 5.0, 2.0 suffit
    ic_loss_target: 0.5        # On veut que l'IC soit la référence (poids 1.0)
    bc_loss: 1.0
    
  # Seuils Audit
  target_error_ic: 0.035       
  target_error_global: 0.055  
  save_dir: "results/CGL_Lite_Adaptive_v1"
  
  ic_phase:
    learning_rate: 3e-4
    iterations: 15000

# -----------------------------

time_marching:
  learning_rate: 2e-4       
                              # Avec le Soft Start (divisé par 2), ça commencera à 1.5e-4. C'est parfait.
  zones:
    - t_end: 0.05    # Une toute petite zone de démarrage
      dt: 0.002      # Pas très fins (20 pas pour faire 0.05)
      iters: 5000    # Moins d'itérations par pas, car le pas est petit
    - t_end: 0.15
      dt: 0.01       # On reprend le rythme normal ensuite
      iters: 9000          # <--- AUGMENTÉ : Modèle plus petit = on peut itérer plus vite.
    - t_end: 2.0
      dt: 0.05
      iters: 9000
    - t_end: 4.0
      dt: 0.1
      iters: 10000