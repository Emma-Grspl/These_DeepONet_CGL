experiment_name: "CGL_GlobalMultistage_Parametric_alpha_beta_mu_sigma08_v4_alpha_protocol_t5"
device: "cuda"

physics:
  x_domain: [-40.0, 40.0]
  t_max: 5.0
  initial_conditions: [0]
  bounds:
    A: [0.1, 0.1]
    w0: [0.8, 0.8]
    x0: [0.0, 0.0]
    k: [0.0, 0.0]
  equation_params:
    alpha: [0.5, 1.5]
    beta: [-0.5, 0.5]
    mu: [0.0, 1.0]
    V: [0.0, 0.0]

model:
  branch_input_dim: 9
  trunk_input_dim: 2
  latent_dim: 768
  branch_layers: [512, 512, 512, 512, 512]
  trunk_layers: [512, 512, 512, 512]
  activation: "silu"
  fourier_dim: 64
  fourier_scales: [1.0, 2.0, 5.0, 10.0, 20.0]

multistage:
  time_blocks:
    - [0.0, 1.0]
    - [1.0, 1.5]
    - [1.5, 2.0]
    - [2.0, 3.0]
    - [3.0, 3.5]
    - [3.5, 4.0]
    - [4.0, 4.5]
    - [4.5, 5.0]

data:
  solver_nx: 256
  solver_dt: 0.025
  train_queries: 8192
  valid_queries: 4096

parametric_dataset:
  train_cases: 256
  valid_cases: 64
  seed: 1262

hard_case_sampling:
  enabled: true
  audit_cases: 64
  audit_seed_offset: 2000
  warmup_epochs: 5000
  refresh_every: 2000
  hard_fraction: 0.4
  mix_hard_ratio: 0.7
  success_threshold: 0.05
  activation_mean_threshold: 0.05
  activation_bad_fraction_threshold: 0.20
  activation_max_threshold: 0.10

spatial_focus_sampling:
  enabled: true
  center_window: [-10.0, 10.0]
  center_fraction: 0.8

temporal_focus_sampling:
  enabled: true
  start_fraction: 0.6
  start_window_fraction: 0.25

warm_start_interstage:
  enabled: true

continuity_loss:
  enabled: true
  weight: 0.2
  queries: 2048

parametric_focus_sampling:
  enabled: false
  focus_cases: 128
  focus_seed_offset: 3000
  focus_fraction: 0.5
  active_hard_fraction: 0.2
  physics:
    equation_params:
      alpha: [1.3, 1.5]
      beta: [-0.5, 0.5]
      mu: [0.0, 0.3]

adaptive_stage_refinement:
  enabled: false
  extra_epochs: 5000
  max_refinement_rounds: 1
  trigger_mean_threshold: 0.04
  trigger_bad_fraction_threshold: 0.12
  trigger_max_threshold: 0.08
  hard_mix_ratio: 0.7
  refresh_every: 1000

auto_resume:
  enabled: true

training:
  save_dir: "results/CGL_GlobalMultistage_Parametric_alpha_beta_mu_sigma08_v4_alpha_protocol_t5"
  stage_num_epochs: 30000
  learning_rate: 2.0e-4
  weight_decay: 1.0e-6
  grad_clip: 1.0
  log_every: 200
  eval_every: 1000
  snapshot_every: 5000

evaluation:
  cases:
    - label: "mid_mid_mid"
      A: 0.1
      w0: 0.8
      alpha: 1.0
      beta: 0.0
      mu: 0.5
    - label: "alpha_min_beta_mid_mu_mid"
      A: 0.1
      w0: 0.8
      alpha: 0.5
      beta: 0.0
      mu: 0.5
    - label: "alpha_max_beta_mid_mu_mid"
      A: 0.1
      w0: 0.8
      alpha: 1.5
      beta: 0.0
      mu: 0.5
    - label: "alpha_mid_beta_min_mu_mid"
      A: 0.1
      w0: 0.8
      alpha: 1.0
      beta: -0.5
      mu: 0.5
    - label: "alpha_mid_beta_max_mu_mid"
      A: 0.1
      w0: 0.8
      alpha: 1.0
      beta: 0.5
      mu: 0.5
    - label: "alpha_mid_beta_mid_mu_min"
      A: 0.1
      w0: 0.8
      alpha: 1.0
      beta: 0.0
      mu: 0.0
    - label: "alpha_mid_beta_mid_mu_max"
      A: 0.1
      w0: 0.8
      alpha: 1.0
      beta: 0.0
      mu: 1.0
    - label: "alpha_max_beta_mid_mu_min"
      A: 0.1
      w0: 0.8
      alpha: 1.5
      beta: 0.0
      mu: 0.0
    - label: "alpha_max_beta_min_mu_min"
      A: 0.1
      w0: 0.8
      alpha: 1.5
      beta: -0.5
      mu: 0.0
    - label: "alpha_max_beta_max_mu_min"
      A: 0.1
      w0: 0.8
      alpha: 1.5
      beta: 0.5
      mu: 0.0
