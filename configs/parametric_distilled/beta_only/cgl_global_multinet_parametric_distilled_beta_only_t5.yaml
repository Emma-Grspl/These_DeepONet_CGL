experiment_name: "CGL_GlobalMultinet_ParametricDistilled_beta_only_t5"
device: "cuda"

physics:
  x_domain: [-40.0, 40.0]
  t_max: 5.0
  initial_conditions: [0]
  bounds:
    A: [0.1, 0.1]
    w0: [0.6, 0.6]
    x0: [0.0, 0.0]
    k: [0.0, 0.0]
  equation_params:
    alpha: [0.75, 0.75]
    beta: [-0.5, 0.5]
    mu: [0.0, 0.0]
    V: [0.0, 0.0]

model:
  branch_input_dim: 9
  trunk_input_dim: 2
  latent_dim: 512
  branch_layers: [512, 512, 512, 512, 512]
  trunk_layers: [512, 512, 512, 512]
  activation: "silu"
  fourier_dim: 64
  fourier_scales: [1.0, 2.0, 5.0, 10.0, 20.0]

multistage:
  time_blocks:
    - [0.0, 1.0]
    - [1.0, 2.0]
    - [2.0, 3.0]
    - [3.0, 4.0]
    - [4.0, 5.0]

data:
  solver_nx: 256
  solver_dt: 0.025

parametric_dataset:
  train_cases: 96
  valid_cases: 24
  seed: 7241

teacher_distillation:
  variable: "beta"
  anchor_fraction: 0.35
  focus_fraction: 0.0
  overlap_width: 0.05
  anchors:
    - label: "beta_min"
      variable_value: -0.5
      teacher_checkpoint: "FILL_ME_teacher_beta_min_checkpoint.pth"
      params:
        alpha: 0.75
        beta: -0.5
        mu: 0.0
        V: 0.0
        A: 0.1
        w0: 0.6
        x0: 0.0
        k: 0.0
        type: 0
    - label: "beta_mid"
      variable_value: 0.0
      teacher_checkpoint: "FILL_ME_teacher_beta_mid_checkpoint.pth"
      params:
        alpha: 0.75
        beta: 0.0
        mu: 0.0
        V: 0.0
        A: 0.1
        w0: 0.6
        x0: 0.0
        k: 0.0
        type: 0
    - label: "beta_max"
      variable_value: 0.5
      teacher_checkpoint: "FILL_ME_teacher_beta_max_checkpoint.pth"
      params:
        alpha: 0.75
        beta: 0.5
        mu: 0.0
        V: 0.0
        A: 0.1
        w0: 0.6
        x0: 0.0
        k: 0.0
        type: 0

focus_sampling:
  enabled: false

spatial_focus_sampling:
  enabled: true
  center_fraction: 0.8

temporal_focus_sampling:
  enabled: true
  start_fraction: 0.55
  start_window_fraction: 0.25

warm_start_interstage:
  enabled: true

training:
  save_dir: "results/CGL_GlobalMultinet_ParametricDistilled_beta_only_t5"
  stage_num_epochs: 25000
  learning_rate: 2.0e-4
  weight_decay: 1.0e-6
  grad_clip: 1.0
  log_every: 200
  eval_every: 1000
  snapshot_every: 5000
  lr_decay_step: 4000
  lr_decay_gamma: 0.85
  train_queries: 8192
  valid_queries: 4096
  boundary_queries: 1024
  continuity_queries: 2048
  overlap_queries: 2048
  smooth_queries: 1024
  smooth_delta_fraction: 0.05
  valid_eval_batches: 2
  loss_weights:
    anchor: 1.0
    boundary: 0.1
    continuity: 0.5
    overlap: 0.25
    param_smooth: 0.01
  early_stop:
    enabled: true
    min_epochs: 6000
    patience_evals: 4
    min_delta_rel: 0.005

evaluation:
  cases:
    - label: "beta_min"
      A: 0.1
      w0: 0.6
      alpha: 0.75
      beta: -0.5
      mu: 0.0
    - label: "beta_mid"
      A: 0.1
      w0: 0.6
      alpha: 0.75
      beta: 0.0
      mu: 0.0
    - label: "beta_max"
      A: 0.1
      w0: 0.6
      alpha: 0.75
      beta: 0.5
      mu: 0.0
