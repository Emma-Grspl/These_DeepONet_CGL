experiment_name: "CGL_GlobalMultinet_PhysicsOnly_Curriculum_V6InnerCurr_AmpPhase_alpha075_beta0_mu0_t1"
device: "cuda"

physics:
  x_domain: [-40.0, 40.0]
  t_max: 1.0
  initial_conditions: [0]
  bounds:
    A: [0.25, 0.25]
    w0: [1.25, 1.25]
    x0: [0.0, 0.0]
    k: [0.0, 0.0]
  equation_params:
    alpha: [0.75, 0.75]
    beta: [0.0, 0.0]
    mu: [0.0, 0.0]
    V: [0.0, 0.0]

model:
  branch_input_dim: 9
  trunk_input_dim: 2
  latent_dim: 512
  branch_layers: [512, 512, 512, 512, 512]
  trunk_layers: [512, 512, 512, 512]
  activation: "silu"
  fourier_dim: 64
  fourier_scales: [1.0, 2.0, 5.0, 10.0, 20.0]

training:
  logic_variant: "modern"
  batch_size_ic: 8192
  batch_size_pde: 8192
  max_macro_loops: 1
  weights:
    bc_loss: 1.0
  spatial_sampling:
    gaussian_fraction: 0.50
    core_fraction: 0.30
    core_bounds: [-10.0, 10.0]
    gaussian_scale: 1.5
  physics_losses:
    pde_relative_weight: 0.75
    weak_weight: 0.05
    mass_weight: 0.03
    continuity_weight: 0.45
    mass_n_cases: 16
    mass_n_x: 160
    continuity_batch_size: 2048
    continuity_mode: "window_overlap"
    continuity_window_fraction: 0.35
    continuity_window_min: 0.05
    continuity_window_max: 0.10
    continuity_window_points: 4
  early_stop:
    enabled: true
    min_iters: 8000
    patience_audits: 4
    min_score_improvement: 0.001
    min_loss_improvement_rel: 0.03
    audit_every: 800
  hard_audit:
    enabled: false
  target_error_global: 0.04
  save_dir: "results/CGL_GlobalMultinet_PhysicsOnly_Curriculum_V6InnerCurr_AmpPhase_alpha075_beta0_mu0_t1"

time_marching:
  learning_rate: 2e-4
  dt_min: 0.0125
  lr_decay_step: 4000
  lr_decay_gamma: 0.85

multistage:
  warm_start_interstage: true
  time_blocks:
    - [0.0, 0.25]
    - [0.25, 0.5]
    - [0.5, 0.75]
    - [0.75, 1.0]

multistage_training:
  stage_num_iters: 16000
  target_error_by_stage: [0.025, 0.030, 0.035, 0.040]
  allow_relaxation: false
  require_stage_targets_to_advance: true
  audit_cases: 1
  log_every: 100
  eval_every: 800
  snapshot_every: 3200
  grad_clip: 1.0
  ema_alpha: 0.999
  relaxation_delta: 0.005
  internal_curriculum:
    enabled: true
    promote_fraction_best: true
    rollback_to_best_fraction: true
    fractions: [0.20, 0.35, 0.50, 0.65, 0.80, 0.90, 1.00]
    target_scale_by_phase: [0.60, 0.70, 0.80, 0.90, 1.00, 1.00, 1.00]
  historical_validation:
    enabled: true
    solver_nx: 256
    time_stride: 4
    selection_metric: "historical_tail_guard"
    selection_weights:
      max: 1.0
      final: 0.35
      mean: 0.10
    target_by_stage: [0.015, 0.020, 0.025, 0.030]
    max_target_by_stage: [0.040, 0.045, 0.050, 0.055]
    require_max_target: true

benchmark:
  solver_nx: 256
  eval_times: [0.05, 0.1, 0.2, 0.25, 0.5, 0.75, 1.0]
  prediction_chunk_size: 32768
  timing_repeats: 4
